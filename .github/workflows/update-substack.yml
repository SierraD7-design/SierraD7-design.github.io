name: Update latest Substack post

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch newest post from Substack RSS
        run: |
          curl -fsSL -A 'Mozilla/5.0' https://sierralowder.substack.com/feed -o feed.xml
          python3 - <<'PY'
          import html
          import json
          import re
          import xml.etree.ElementTree as ET

          root = ET.parse('feed.xml').getroot()
          items = root.findall('./channel/item')
          if not items:
              raise SystemExit('No posts in feed')

          item = items[0]
          title = (item.findtext('title') or 'Latest post').strip()
          url = (item.findtext('link') or '').strip()
          if not url:
              raise SystemExit('No post URL in feed')

          description = item.findtext('description') or ''
          subtitle = html.unescape(re.sub('<[^>]+>', '', description)).strip()

          result = {
              'title': title,
              'url': url,
              'subtitle': subtitle,
              'date': (item.findtext('pubDate') or '').strip(),
          }
          with open('latest-post.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          rm feed.xml

      - name: Commit updated post data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-post.json
          if git diff --cached --quiet; then
            echo "No change to latest post"
          else
            git commit -m "Update latest Substack post"
            git push
          fi
