<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sierra | Personal Website</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1c1e21;
      --muted: #60636a;
      --accent: #2f6fed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --card: #1c1f26;
        --text: #f2f3f5;
        --muted: #a9adb6;
        --accent: #7aa2ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 620px;
      background: var(--card);
      border-radius: 16px;
      padding: 48px 40px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 2.2rem; }
    p { margin: 0 0 32px; color: var(--muted); font-size: 1.1rem; }
    nav { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a {
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 10px 20px;
      font-weight: 600;
      transition: background 0.15s ease, color 0.15s ease;
    }
    a:hover { background: var(--accent); color: var(--card); }
    footer { margin-top: 40px; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Hi, I'm Sierra 👋</h1>
    <p>Welcome to my personal website. This is just the beginning — more to come soon.</p>
    <nav>
      <a href="https://github.com/SierraD7-design">GitHub</a>
      <a href="mailto:hello@example.com">Email</a>
    </nav>
    <footer>Built with GitHub Pages</footer>
  </main>
</body>
</html>
